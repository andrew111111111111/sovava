<div class="backdrop is-hidden">
  <div class="modal">
    <button class="modal-closer">
      <img src="./images/close.svg" alt="press to close" />
    </button>

    <div class="small-modal-photo">
      <img src="#" alt="#" data-photo-small />
    </div>
    <div class="modal-info">
      <div class="large-modal-photo"></div>
      <div class="modal-text-info">
        <h3 class="modal-title">INFO</h3>
        <p class="modal-text text-info"></p>
        <h3 class="modal-title">WHEN</h3>
        <p class="modal-text text-time">
          <span class="text-time-span"></span>
        </p>

        <h3 class="modal-title">WHERE</h3>
        <p class="modal-text text-place">
          <span class="text-place-span"></span>
        </p>

        <h3 class="modal-title">WHO</h3>
        <p class="modal-text text-people"></p>

        <h3 class="modal-title">PRICES</h3>
        <p class="modal-text modal-price">Standard 300-500 UAH</p>
        <button class="modal-btn normal-price">BUY TICKETS</button>
        <p class="modal-text modal-price vip-price">VIP 1000-1500 UAH</p>
        <button class="modal-btn vip-price">BUY TICKETS</button>
      </div>
    </div>
    <button class="modal-more modal-btn">MORE FROM THIS AUTHOR</button>
  </div>
</div>
