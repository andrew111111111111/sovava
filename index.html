<!DOCTYPE html><html lang=en><meta charset=UTF-8><meta name=viewport content="width=device-width, initial-scale=1.0"><title>Event booster</title><link rel=icon href=logo.d97fd98b.png><link rel=preconnect href=https://fonts.googleapis.com><link rel=preconnect href=https://fonts.gstatic.com crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&amp;display=swap" rel=stylesheet><script type=module src=sovava.3f753783.js></script><link rel=stylesheet href=sovava.b75652ae.css><body>
    <header class=header>
      <header class=header>
  <a href=#><img src=logo.d97fd98b.png alt=logo class=logo></a>
  <div class=container>
    <h1 class=header-title>
      FIND BEST EVENTS<br>
      AROUND THE WORLD
    </h1>
    <ul class=header-list>
      <li>
        <input name=chivava id=header-input class=header-input placeholder="Start searching">
      </li>
      <li>
        <div class=country-select>
        </div>
      </li>
    </ul>
  </div>
</header>

    </header>
    <main class=main>
      <div class=container>
  <ul class=event__list></ul>
</div>

      <div class="backdrop is-hidden">
  <div class=modal>
    <button class=modal-closer>
      <img src=close.ffad4e77.svg alt="press to close">
    </button>

    <div class=small-modal-photo>
      <img src=# alt=# data-photo-small>
    </div>
    <div class=modal-info>
      <div class=large-modal-photo></div>
      <div class=modal-text-info>
        <h3 class=modal-title>INFO</h3>
        <p class="modal-text text-info"></p>
        <h3 class=modal-title>WHEN</h3>
        <p class="modal-text text-time">
          <span class=text-time-span></span>
        </p>

        <h3 class=modal-title>WHERE</h3>
        <p class="modal-text text-place">
          <span class=text-place-span></span>
        </p>

        <h3 class=modal-title>WHO</h3>
        <p class="modal-text text-people"></p>

        <h3 class=modal-title>PRICES</h3>
        <p class="modal-price modal-price-def modal-text"></p>
        <button class="modal-btn normal-price">BUY TICKETS</button>
        <p class="modal-price modal-price-vip modal-text vip-price"></p>
        <button class="modal-btn vip-price">BUY TICKETS</button>
      </div>
    </div>
    <button class="modal-btn modal-more">MORE FROM THIS AUTHOR</button>
  </div>
</div>

      <div class="bonus__container container">
  <h2 class=bonus__title>Today's most important events</h2>
  <ul class=bonus__list></ul>
</div>

      <section class=pagination>
  <div class=container>
    <ul class=pagination__list data-pagination-list></ul>
  </div>
</section>

      <div class="error-backdrop is-hidden">
        <div class=error-container>
          <button class=error-closer></button>
          <div class=error-text-container></div>
        </div>
      </div>
    </main>
    <footer class=footer>
      <div class=footer-bottom>
  <p class=footer-copyright>

  </p>
</div>
    </footer>
